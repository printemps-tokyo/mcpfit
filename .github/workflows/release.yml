name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The release is created once, before the matrix: jobs creating it at the
  # same moment used to collide, leaving one of them unable to upload.
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release if it does not exist
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          outdir="dist"
          name="mcpfit_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$outdir"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$outdir/mcpfit" .
          tar -C "$outdir" -czf "$outdir/${name}.tar.gz" mcpfit
          rm "$outdir/mcpfit"
          ( cd "$outdir" && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
